<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPTV Activation Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
  :root {
    --bg: #0f1318;
    --panel: #171d24;
    --line: #29313b;
    --fg: #e8edf2;
    --muted: #8f9baa;
    --accent: #ffb547;
    --accent-ink: #1a1203;
    --good: #4cc38a;
    --warn: #ffb547;
    --bad: #ef6b6b;
    --info: #6aa8ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .2px; }
  h1 span { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button {
    background: #26303b; border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 14px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--bad); }
  button.small { padding: 4px 10px; font-size: 13px; }
  input, select, textarea {
    background: #0c1015; border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; width: 100%;
  }
  textarea { font-family: ui-monospace, Menlo, Consolas, monospace; resize: vertical; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  .login { max-width: 380px; margin: 12vh auto 0; }
  .login h1 { margin-bottom: 4px; }
  .msg { min-height: 20px; margin-top: 10px; font-size: 14px; }
  .msg.err { color: var(--bad); }
  .msg.ok { color: var(--good); }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 10px 16px; color: var(--muted); white-space: nowrap; }
  .tab:hover { color: var(--fg); }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 16px; min-width: 110px; cursor: pointer; text-align: left;
  }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .stat.on { border-color: var(--accent); }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .toolbar input { flex: 1; min-width: 200px; }
  .toolbar .grow { flex: 1; }

  .tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  table { width: 100%; border-collapse: collapse; min-width: 760px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.mono { font-family: ui-monospace, Menlo, Consolas, monospace; white-space: nowrap; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .url { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; }
  .pill.active, .pill.unused { color: var(--good); }
  .pill.pending { color: var(--info); }
  .pill.expired, .pill.used { color: var(--warn); }
  .pill.disabled { color: var(--bad); }
  .pill.m3u { color: var(--info); }
  .pill.xtream { color: var(--accent); }
  .empty { padding: 36px 16px; text-align: center; color: var(--muted); }
  .actions { display: flex; gap: 6px; justify-content: flex-end; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20;
  }
  .modal { width: 100%; max-width: 500px; max-height: 92vh; overflow-y: auto; }
  .modal h2 { margin: 0 0 4px; font-size: 18px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; min-width: 0; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--fg); font-size: 15px; }
  .check input { width: auto; }
  .foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .setup { max-width: 560px; margin: 10vh auto 0; }
  .setup code { background: #0c1015; padding: 2px 6px; border-radius: 4px; }
  .settings { max-width: 560px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function () {
  var cfg = window.PANEL_CONFIG || {};
  var app = document.getElementById("app");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) {
    app.innerHTML = '<div class="card setup"><h1>IPTV <span>Panel</span></h1>' +
      '<p>The panel is not connected yet. Open <code>docs/config.js</code> in your repository, ' +
      'paste your Supabase URL and anon key, and save. See SETUP-PANEL.md.</p></div>';
    return;
  }

  var sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  var devices = [], sources = [], codes = [];
  var settings = { allow_own: true };
  var tab = "devices";
  var filter = "all";
  var search = "";

  // ---------- helpers ----------
  function srcById(id) {
    for (var i = 0; i < sources.length; i++) if (sources[i].id === id) return sources[i];
    return null;
  }
  function statusOf(d) {
    if (!d.enabled) return "disabled";
    if (!d.source_id && !d.playlist_url) return "pending";
    if (d.expires_at && new Date(d.expires_at) < new Date()) return "expired";
    return "active";
  }
  function linkLabel(d) {
    if (d.source_id) { var s = srcById(d.source_id); return s ? s.name : "(removed source)"; }
    return d.playlist_url || "";
  }
  function fmtDate(iso) {
    if (!iso) return "No expiry";
    return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }
  function fmtSeen(iso) {
    if (!iso) return "Never";
    var mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (mins < 2) return "Just now";
    if (mins < 60) return mins + " min ago";
    if (mins < 1440) return Math.round(mins / 60) + " h ago";
    return Math.round(mins / 1440) + " d ago";
  }
  function toDateInput(d) {
    var p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function normMac(s) {
    var hex = String(s).toUpperCase().replace(/[^0-9A-F]/g, "");
    return hex.length === 12 ? hex.match(/.{2}/g).join(":") : null;
  }
  function fmtCode(c) { return c.match(/.{1,4}/g).join("-"); }
  function newCode() {
    var A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", out = "";
    var b = new Uint8Array(12);
    crypto.getRandomValues(b);
    for (var i = 0; i < 12; i++) out += A[b[i] % 32];
    return out;
  }
  function sourceOptions(selected, firstLabel) {
    return '<option value="">' + esc(firstLabel) + '</option>' + sources.map(function (s) {
      return '<option value="' + esc(s.id) + '"' + (s.id === selected ? " selected" : "") + '>' +
        esc(s.name) + ' (' + (s.type === "xtream" ? "Xtream" : "M3U") + ')</option>';
    }).join("");
  }
  function sourceDetail(s) {
    return s.type === "xtream" ? s.server + "  /  " + s.username : s.m3u_url;
  }
  function dbError(err) {
    if (/foreign key|violates/i.test(err.message)) return "This source is still used by devices or codes. Remove it from them first.";
    if (/duplicate|already exists/i.test(err.message)) return "That entry already exists.";
    return err.message;
  }
  function clickTwice(btn, label, run) {
    btn.addEventListener("click", function () {
      if (btn.getAttribute("data-sure") !== "1") {
        btn.setAttribute("data-sure", "1");
        btn.textContent = label;
        return;
      }
      run();
    });
  }
  function bind(sel, ev, fn) {
    Array.prototype.forEach.call(app.querySelectorAll(sel), function (el) {
      el.addEventListener(ev, function () { fn(el); });
    });
  }

  // ---------- modal ----------
  function modal(html) {
    var ov = document.createElement("div");
    ov.className = "overlay";
    ov.innerHTML = '<form class="card modal">' + html + '</form>';
    document.body.appendChild(ov);
    var m = {
      ov: ov,
      form: ov.querySelector("form"),
      msg: ov.querySelector(".msg"),
      q: function (s) { return ov.querySelector(s); },
      close: function () { ov.remove(); }
    };
    ov.addEventListener("mousedown", function (e) { if (e.target === ov) m.close(); });
    var cn = ov.querySelector("[data-cancel]");
    if (cn) cn.addEventListener("click", m.close);
    return m;
  }

  // ---------- login ----------
  function renderLogin(msg) {
    app.innerHTML =
      '<div class="card login"><h1>IPTV <span>Panel</span></h1>' +
      '<div style="color:var(--muted)">Admin sign in</div>' +
      '<form id="lf"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required>' +
      '<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>' +
      '<div class="msg err" id="lm">' + esc(msg || "") + '</div>' +
      '<button class="primary" type="submit" style="width:100%">Sign in</button></form></div>';
    document.getElementById("lf").addEventListener("submit", function (e) {
      e.preventDefault();
      var lm = document.getElementById("lm");
      lm.textContent = "";
      sb.auth.signInWithPassword({
        email: document.getElementById("em").value.trim(),
        password: document.getElementById("pw").value
      }).then(function (r) {
        if (r.error) { lm.textContent = r.error.message; return; }
        load();
      });
    });
  }

  // ---------- data ----------
  function load() {
    Promise.all([
      sb.from("devices").select("*").order("created_at", { ascending: false }),
      sb.from("sources").select("*").order("name"),
      sb.from("codes").select("*").order("created_at", { ascending: false }),
      sb.from("settings").select("*").eq("id", 1).maybeSingle()
    ]).then(function (r) {
      var bad = r.filter(function (x) { return x.error; })[0];
      if (bad) { renderLogin(bad.error.message + " (did you run the latest supabase-setup.sql?)"); return; }
      devices = r[0].data || [];
      sources = r[1].data || [];
      codes = r[2].data || [];
      settings = r[3].data || { allow_own: true };
      render();
    });
  }

  // ---------- layout ----------
  function render() {
    var tabs = [["devices", "Devices"], ["sources", "Sources"], ["codes", "Codes"], ["settings", "Settings"]];
    app.innerHTML =
      '<header><h1>IPTV <span>Panel</span></h1>' +
      '<div style="display:flex;gap:8px"><button id="refb">Refresh</button><button id="outb">Sign out</button></div></header>' +
      '<div class="tabs">' + tabs.map(function (t) {
        return '<button class="tab' + (tab === t[0] ? " on" : "") + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
      }).join("") + '</div><div id="view"></div>';
    bind("[data-tab]", "click", function (b) { tab = b.getAttribute("data-tab"); render(); });
    document.getElementById("refb").addEventListener("click", load);
    document.getElementById("outb").addEventListener("click", function () {
      sb.auth.signOut().then(function () { renderLogin(); });
    });
    var v = document.getElementById("view");
    if (tab === "devices") viewDevices(v);
    else if (tab === "sources") viewSources(v);
    else if (tab === "codes") viewCodes(v);
    else viewSettings(v);
  }

  // ---------- devices ----------
  function viewDevices(v) {
    var c = { all: devices.length, active: 0, pending: 0, expired: 0, disabled: 0 };
    devices.forEach(function (d) { c[statusOf(d)]++; });
    var q = search.trim().toLowerCase();
    var list = devices.filter(function (d) {
      if (filter !== "all" && statusOf(d) !== filter) return false;
      if (!q) return true;
      return (d.mac + " " + d.client_name + " " + d.notes + " " + linkLabel(d)).toLowerCase().indexOf(q) >= 0;
    });
    var stats = ["all", "active", "pending", "expired", "disabled"].map(function (k) {
      return '<button class="stat' + (filter === k ? " on" : "") + '" data-f="' + k + '"><b>' + c[k] +
        '</b><span>' + k + '</span></button>';
    }).join("");
    var rows = list.map(function (d) {
      var st = statusOf(d);
      return '<tr><td class="mono">' + esc(d.mac) + '</td><td>' + esc(d.client_name || "-") + '</td>' +
        '<td><span class="pill ' + st + '">' + st + '</span></td>' +
        '<td class="num">' + esc(fmtDate(d.expires_at)) + '</td>' +
        '<td class="num">' + esc(fmtSeen(d.last_seen)) + '</td>' +
        '<td class="url" title="' + esc(linkLabel(d)) + '">' + esc(linkLabel(d) || "-") + '</td>' +
        '<td><div class="actions"><button class="small" data-edit="' + esc(d.mac) + '">Edit</button></div></td></tr>';
    }).join("");
    v.innerHTML =
      '<div class="stats">' + stats + '</div>' +
      '<div class="toolbar"><input id="sq" type="search" placeholder="Search by device ID, client, note or source" value="' + esc(search) + '">' +
      '<button id="addb" class="primary">Add device</button></div>' +
      '<div class="tablebox"><table><thead><tr><th>Device ID</th><th>Client</th><th>Status</th><th>Expires</th>' +
      '<th>Last seen</th><th>Source</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>' +
      (list.length ? "" : '<div class="empty">' + (devices.length
        ? "No devices match this filter."
        : "No devices yet. Open the TV app: its Device ID appears here as Pending. You can also add one by hand.") + '</div>') +
      '</div>';
    bind("[data-f]", "click", function (b) { filter = b.getAttribute("data-f"); render(); });
    bind("[data-edit]", "click", function (b) {
      var mac = b.getAttribute("data-edit");
      deviceModal(devices.filter(function (d) { return d.mac === mac; })[0]);
    });
    var sq = document.getElementById("sq");
    sq.addEventListener("input", function () {
      search = sq.value;
      var pos = sq.selectionStart;
      render();
      var again = document.getElementById("sq");
      again.focus();
      again.setSelectionRange(pos, pos);
    });
    document.getElementById("addb").addEventListener("click", function () { deviceModal(null); });
  }

  function deviceModal(d) {
    var isNew = !d;
    d = d || { mac: "", client_name: "", playlist_url: "", source_id: null, expires_at: null, enabled: true, notes: "" };
    var cu = { xt: false, server: "", user: "", pass: "" };
    var pm = /^(https?:\/\/[^?]*?)\/get\.php\?username=([^&]*)&password=([^&]*)&type=m3u_plus&output=ts$/.exec(d.playlist_url || "");
    if (pm) {
      try { cu = { xt: true, server: pm[1], user: decodeURIComponent(pm[2]), pass: decodeURIComponent(pm[3]) }; } catch (e) {}
    }
    var m = modal(
      '<h2>' + (isNew ? "Add device" : "Edit device") + '</h2>' +
      '<label for="f_mac">Device ID (MAC)</label>' +
      '<input id="f_mac" value="' + esc(d.mac) + '" placeholder="AA:BB:CC:DD:EE:FF"' + (isNew ? "" : " readonly") + ' required>' +
      '<label for="f_name">Client name</label><input id="f_name" value="' + esc(d.client_name) + '">' +
      '<label for="f_src">Source</label><select id="f_src">' + sourceOptions(d.source_id, "Custom link (type it below)") + '</select>' +
      '<div id="urlbox"><label for="f_ctype">Login type</label><select id="f_ctype">' +
      '<option value="m3u"' + (cu.xt ? "" : " selected") + '>M3U link</option>' +
      '<option value="xtream"' + (cu.xt ? " selected" : "") + '>Xtream (server, username, password)</option></select>' +
      '<div id="g_dm3u"><label for="f_url">Playlist link (M3U)</label>' +
      '<input id="f_url" type="url" value="' + esc(cu.xt ? "" : d.playlist_url) + '" placeholder="http://..."></div>' +
      '<div id="g_dxt"><label for="f_srv">Server</label><input id="f_srv" value="' + esc(cu.server) + '" placeholder="http://host:port" autocomplete="off">' +
      '<div class="row"><div><label for="f_usr">Username</label><input id="f_usr" value="' + esc(cu.user) + '" autocomplete="off"></div>' +
      '<div><label for="f_pwd">Password</label><input id="f_pwd" value="' + esc(cu.pass) + '" autocomplete="off"></div></div></div></div>' +
      '<label for="f_exp">Expires on</label><input id="f_exp" type="date" value="' + (d.expires_at ? toDateInput(new Date(d.expires_at)) : "") + '">' +
      '<div class="quick"><button type="button" class="small" data-m="1">+1 month</button>' +
      '<button type="button" class="small" data-m="3">+3 months</button>' +
      '<button type="button" class="small" data-m="6">+6 months</button>' +
      '<button type="button" class="small" data-m="12">+12 months</button>' +
      '<button type="button" class="small" data-m="0">No expiry</button></div>' +
      '<label for="f_notes">Notes</label><input id="f_notes" value="' + esc(d.notes) + '">' +
      '<label class="check"><input id="f_en" type="checkbox"' + (d.enabled ? " checked" : "") + '> Enabled</label>' +
      '<div class="msg err"></div>' +
      '<div class="foot">' + (isNew ? "" : '<button type="button" id="delb" class="danger" style="margin-right:auto">Delete</button>') +
      '<button type="button" data-cancel>Cancel</button><button class="primary" type="submit">Save</button></div>'
    );
    function syncUrl() {
      m.q("#urlbox").hidden = !!m.q("#f_src").value;
      var x = m.q("#f_ctype").value === "xtream";
      m.q("#g_dxt").hidden = !x;
      m.q("#g_dm3u").hidden = x;
    }
    m.q("#f_src").addEventListener("change", syncUrl);
    m.q("#f_ctype").addEventListener("change", syncUrl);
    syncUrl();

    Array.prototype.forEach.call(m.ov.querySelectorAll("[data-m]"), function (b) {
      b.addEventListener("click", function () {
        var n = parseInt(b.getAttribute("data-m"), 10), exp = m.q("#f_exp");
        if (n === 0) { exp.value = ""; return; }
        var base = exp.value ? new Date(exp.value + "T00:00:00") : new Date();
        if (base < new Date()) base = new Date();
        base.setMonth(base.getMonth() + n);
        exp.value = toDateInput(base);
      });
    });

    var del = m.q("#delb");
    if (del) {
      clickTwice(del, "Click again to delete", function () {
        sb.from("devices").delete().eq("mac", d.mac).then(function (r) {
          if (r.error) { m.msg.textContent = r.error.message; return; }
          m.close(); load();
        });
      });
    }

    m.form.addEventListener("submit", function (e) {
      e.preventDefault();
      m.msg.textContent = "";
      var mac = normMac(m.q("#f_mac").value);
      if (!mac) { m.msg.textContent = "Enter a valid device ID: 12 hex characters like AA:BB:CC:DD:EE:FF."; return; }
      if (isNew) {
        var dup = devices.filter(function (x) { return x.mac === mac; })[0];
        if (dup) { m.close(); deviceModal(dup); return; }
      }
      var expv = m.q("#f_exp").value, src = m.q("#f_src").value;
      var link = "";
      if (!src) {
        if (m.q("#f_ctype").value === "xtream") {
          var srv = m.q("#f_srv").value.trim().replace(/\/+$/, ""), usr = m.q("#f_usr").value.trim(), pwd = m.q("#f_pwd").value.trim();
          if (srv && !/^https?:\/\//i.test(srv)) srv = "http://" + srv;
          if (!srv || !usr || !pwd) { m.msg.textContent = "Server, username and password are all required."; return; }
          link = srv + "/get.php?username=" + encodeURIComponent(usr) + "&password=" + encodeURIComponent(pwd) + "&type=m3u_plus&output=ts";
        } else {
          link = m.q("#f_url").value.trim();
          if (link && !/^https?:\/\//i.test(link)) { m.msg.textContent = "Enter the full link, starting with http:// or https://"; return; }
        }
      }
      var row = {
        mac: mac,
        client_name: m.q("#f_name").value.trim(),
        source_id: src || null,
        playlist_url: link,
        expires_at: expv ? new Date(expv + "T23:59:59").toISOString() : null,
        enabled: m.q("#f_en").checked,
        notes: m.q("#f_notes").value.trim()
      };
      var q = isNew ? sb.from("devices").insert(row) : sb.from("devices").update(row).eq("mac", mac);
      q.then(function (r) {
        if (r.error) { m.msg.textContent = dbError(r.error); return; }
        m.close(); load();
      });
    });
    m.q("#f_mac").focus();
  }

  // ---------- sources ----------
  function viewSources(v) {
    var rows = sources.map(function (s) {
      var n = devices.filter(function (d) { return d.source_id === s.id; }).length;
      return '<tr><td>' + esc(s.name) + '</td>' +
        '<td><span class="pill ' + s.type + '">' + (s.type === "xtream" ? "Xtream" : "M3U") + '</span></td>' +
        '<td class="url" title="' + esc(sourceDetail(s)) + '">' + esc(sourceDetail(s)) + '</td>' +
        '<td class="num">' + n + ' device' + (n === 1 ? "" : "s") + '</td>' +
        '<td><div class="actions"><button class="small" data-sedit="' + esc(s.id) + '">Edit</button></div></td></tr>';
    }).join("");
    v.innerHTML =
      '<div class="toolbar"><span class="grow" style="color:var(--muted)">Your playlists. Give a device or a code a source instead of typing the link each time.</span>' +
      '<button id="adds" class="primary">Add source</button></div>' +
      '<div class="tablebox"><table><thead><tr><th>Name</th><th>Type</th><th>Link / server</th><th>Used by</th><th></th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>' +
      (sources.length ? "" : '<div class="empty">No sources yet. Add an M3U link or an Xtream login.</div>') + '</div>';
    bind("[data-sedit]", "click", function (b) { sourceModal(srcById(b.getAttribute("data-sedit"))); });
    document.getElementById("adds").addEventListener("click", function () { sourceModal(null); });
  }

  function sourceModal(s) {
    var isNew = !s;
    s = s || { name: "", type: "m3u", m3u_url: "", server: "", username: "", password: "" };
    var m = modal(
      '<h2>' + (isNew ? "Add source" : "Edit source") + '</h2>' +
      '<label for="s_name">Name</label><input id="s_name" value="' + esc(s.name) + '" placeholder="Premium package" required>' +
      '<label for="s_type">Type</label><select id="s_type">' +
      '<option value="m3u"' + (s.type === "m3u" ? " selected" : "") + '>M3U link</option>' +
      '<option value="xtream"' + (s.type === "xtream" ? " selected" : "") + '>Xtream login</option></select>' +
      '<div id="g_m3u"><label for="s_url">M3U link</label><input id="s_url" type="url" value="' + esc(s.m3u_url) + '" placeholder="http://..."></div>' +
      '<div id="g_xt"><label for="s_srv">Server</label><input id="s_srv" value="' + esc(s.server) + '" placeholder="http://host:port">' +
      '<div class="row"><div><label for="s_usr">Username</label><input id="s_usr" value="' + esc(s.username) + '" autocomplete="off"></div>' +
      '<div><label for="s_pwd">Password</label><input id="s_pwd" value="' + esc(s.password) + '" autocomplete="off"></div></div></div>' +
      '<div class="msg err"></div>' +
      '<div class="foot">' + (isNew ? "" : '<button type="button" id="sdel" class="danger" style="margin-right:auto">Delete</button>') +
      '<button type="button" data-cancel>Cancel</button><button class="primary" type="submit">Save</button></div>'
    );
    function sync() {
      var x = m.q("#s_type").value === "xtream";
      m.q("#g_xt").hidden = !x;
      m.q("#g_m3u").hidden = x;
    }
    m.q("#s_type").addEventListener("change", sync);
    sync();

    var del = m.q("#sdel");
    if (del) {
      clickTwice(del, "Click again to delete", function () {
        sb.from("sources").delete().eq("id", s.id).then(function (r) {
          if (r.error) { m.msg.textContent = dbError(r.error); return; }
          m.close(); load();
        });
      });
    }

    m.form.addEventListener("submit", function (e) {
      e.preventDefault();
      m.msg.textContent = "";
      var type = m.q("#s_type").value;
      var row = {
        name: m.q("#s_name").value.trim(), type: type,
        m3u_url: "", server: "", username: "", password: ""
      };
      if (type === "m3u") {
        row.m3u_url = m.q("#s_url").value.trim();
        if (!/^https?:\/\//i.test(row.m3u_url)) { m.msg.textContent = "Enter the full M3U link, starting with http:// or https://"; return; }
      } else {
        var srv = m.q("#s_srv").value.trim().replace(/\/+$/, "");
        if (srv && !/^https?:\/\//i.test(srv)) srv = "http://" + srv;
        row.server = srv;
        row.username = m.q("#s_usr").value.trim();
        row.password = m.q("#s_pwd").value.trim();
        if (!row.server || !row.username || !row.password) { m.msg.textContent = "Server, username and password are all required."; return; }
      }
      var q = isNew ? sb.from("sources").insert(row) : sb.from("sources").update(row).eq("id", s.id);
      q.then(function (r) {
        if (r.error) { m.msg.textContent = dbError(r.error); return; }
        m.close(); load();
      });
    });
    m.q("#s_name").focus();
  }

  // ---------- codes ----------
  function viewCodes(v) {
    var unused = codes.filter(function (c) { return !c.used_by; }).length;
    var rows = codes.map(function (c) {
      var src = c.source_id ? (srcById(c.source_id) || {}).name : c.playlist_url;
      var st = c.used_by ? "used" : "unused";
      return '<tr><td class="mono">' + esc(fmtCode(c.code)) + '</td>' +
        '<td><span class="pill ' + st + '">' + st + '</span></td>' +
        '<td class="url" title="' + esc(src) + '">' + esc(src || "-") + '</td>' +
        '<td class="num">' + (c.days === 0 ? "No expiry" : c.days + " days") + '</td>' +
        '<td>' + esc(c.note || "") + '</td>' +
        '<td class="mono">' + (c.used_by ? esc(c.used_by) + "<br><span style='color:var(--muted);font-size:12px'>" + esc(fmtDate(c.used_at)) + "</span>" : "") + '</td>' +
        '<td><div class="actions"><button class="small" data-copy="' + esc(c.code) + '">Copy</button>' +
        '<button class="small danger" data-cdel="' + esc(c.code) + '">Delete</button></div></td></tr>';
    }).join("");
    v.innerHTML =
      '<div class="toolbar"><span class="grow" style="color:var(--muted)">' + unused + ' unused of ' + codes.length +
      '. A code works once. It gives that TV a source for the number of days you chose.</span>' +
      '<button id="addc" class="primary">Generate codes</button></div>' +
      '<div class="tablebox"><table><thead><tr><th>Code</th><th>Status</th><th>Source</th><th>Valid for</th><th>Note</th><th>Used by</th><th></th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>' +
      (codes.length ? "" : '<div class="empty">No codes yet. Generate codes to give to your clients.</div>') + '</div>';
    document.getElementById("addc").addEventListener("click", codeModal);
    bind("[data-copy]", "click", function (b) {
      var text = fmtCode(b.getAttribute("data-copy"));
      var done = function () { b.textContent = "Copied"; };
      try { navigator.clipboard.writeText(text).then(done, function () { b.textContent = text; }); }
      catch (e) { b.textContent = text; }
    });
    bind("[data-cdel]", "click", function (b) {
      if (b.getAttribute("data-sure") !== "1") { b.setAttribute("data-sure", "1"); b.textContent = "Sure?"; return; }
      sb.from("codes").delete().eq("code", b.getAttribute("data-cdel")).then(function (r) {
        if (r.error) { alert(r.error.message); return; }
        load();
      });
    });
  }

  function codeModal() {
    var m = modal(
      '<h2>Generate codes</h2>' +
      '<label for="c_src">Source</label><select id="c_src">' + sourceOptions("", "Custom link (type it below)") + '</select>' +
      '<div id="c_urlbox"><label for="c_url">Playlist link (M3U)</label><input id="c_url" type="url" placeholder="http://..."></div>' +
      '<div class="row"><div><label for="c_days">Valid for</label><select id="c_days">' +
      '<option value="30">30 days</option><option value="90">90 days</option><option value="180">180 days</option>' +
      '<option value="365" selected>365 days</option><option value="0">No expiry</option></select></div>' +
      '<div><label for="c_qty">How many</label><input id="c_qty" type="number" min="1" max="100" value="1"></div></div>' +
      '<label for="c_note">Note (optional)</label><input id="c_note" placeholder="Ahmed, shop 3">' +
      '<div class="msg err"></div>' +
      '<div class="foot"><button type="button" data-cancel>Cancel</button><button class="primary" type="submit">Generate</button></div>'
    );
    function sync() { m.q("#c_urlbox").hidden = !!m.q("#c_src").value; }
    m.q("#c_src").addEventListener("change", sync);
    sync();
    m.form.addEventListener("submit", function (e) {
      e.preventDefault();
      m.msg.textContent = "";
      var src = m.q("#c_src").value, url = m.q("#c_url").value.trim();
      var qty = Math.max(1, Math.min(100, parseInt(m.q("#c_qty").value, 10) || 1));
      if (!src && !/^https?:\/\//i.test(url)) { m.msg.textContent = "Choose a source, or enter a full link starting with http:// or https://"; return; }
      var rows = [];
      for (var i = 0; i < qty; i++) {
        rows.push({
          code: newCode(), source_id: src || null, playlist_url: src ? "" : url,
          days: parseInt(m.q("#c_days").value, 10), note: m.q("#c_note").value.trim()
        });
      }
      sb.from("codes").insert(rows).then(function (r) {
        if (r.error) { m.msg.textContent = dbError(r.error); return; }
        var list = rows.map(function (x) { return fmtCode(x.code); }).join("\n");
        m.form.innerHTML =
          '<h2>' + rows.length + (rows.length === 1 ? " code" : " codes") + ' ready</h2>' +
          '<p class="hint">Copy them now or find them later in the Codes tab.</p>' +
          '<textarea id="c_out" rows="' + Math.min(12, rows.length + 1) + '" readonly>' + esc(list) + '</textarea>' +
          '<div class="msg ok" id="c_ok"></div>' +
          '<div class="foot"><button type="button" id="c_copy">Copy all</button><button type="button" class="primary" id="c_done">Done</button></div>';
        var out = m.q("#c_out");
        out.focus(); out.select();
        m.q("#c_copy").addEventListener("click", function () {
          out.select();
          try { navigator.clipboard.writeText(list).then(function () { m.q("#c_ok").textContent = "Copied."; }, function () {}); } catch (e) {}
        });
        m.q("#c_done").addEventListener("click", function () { m.close(); load(); });
      });
    });
  }

  // ---------- settings ----------
  function viewSettings(v) {
    v.innerHTML =
      '<div class="card settings"><h2 style="margin:0 0 6px;font-size:18px">Client sign-in</h2>' +
      '<p class="hint" style="margin-top:0">On the TV the client can sign in with an activation code. You can also let clients use their own playlist.</p>' +
      '<label class="check"><input id="set_own" type="checkbox"' + (settings.allow_own ? " checked" : "") + '> Allow clients to sign in with their own M3U link or Xtream login</label>' +
      '<p class="hint">When this is off, the TV app only works with devices you activated or codes you issued. Changes reach TVs within about 15 minutes.</p>' +
      '<div class="msg" id="set_msg"></div>' +
      '<div class="foot"><button class="primary" id="set_save">Save</button></div></div>';
    document.getElementById("set_save").addEventListener("click", function () {
      var msg = document.getElementById("set_msg");
      sb.from("settings").upsert({ id: 1, allow_own: document.getElementById("set_own").checked }).then(function (r) {
        msg.className = "msg " + (r.error ? "err" : "ok");
        msg.textContent = r.error ? r.error.message : "Saved.";
        if (!r.error) settings.allow_own = document.getElementById("set_own").checked;
      });
    });
  }

  // ---------- start ----------
  sb.auth.getSession().then(function (r) {
    if (r.data && r.data.session) load(); else renderLogin();
  });
})();
</script>
</body>
</html>
